<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Test college portal — Scout extension harness</title>
<style>
  body{font:15px/1.6 system-ui;background:#eef1f4;margin:0;padding:40px}
  .form{max-width:640px;margin:0 auto;background:#fff;border-radius:12px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  h1{font-size:22px}
  label{display:block;margin:14px 0 4px;font-weight:600;font-size:13px}
  input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;box-sizing:border-box}
  button{margin-top:20px;padding:12px 24px;background:#1a56db;color:#fff;border:none;border-radius:8px;font:600 14px system-ui}
</style>
</head>
<body>
<div class="form">
  <h1>Institute of Technology — Application Form 2027</h1>
  <label for="fname">First Name</label><input id="fname" name="first_name">
  <label for="lname">Last Name</label><input id="lname" name="last_name">
  <label for="em">Email Address</label><input id="em" type="email" name="email">
  <label for="ph">Mobile Number</label><input id="ph" name="mobile">
  <label for="dob">Date of Birth</label><input id="dob" name="dob" placeholder="YYYY-MM-DD">
  <label for="father">Father's Name</label><input id="father" name="father_name">
  <label for="b12">Class 12 Board</label><input id="b12" name="class12_board">
  <label for="p12">Class 12 Percentage</label><input id="p12" name="class12_percent">
  <label for="clg">College / University</label><input id="clg" name="college_name">
  <label for="cg">CGPA</label><input id="cg" name="cgpa">
  <label for="gh">GitHub Profile</label><input id="gh" name="github_url">
  <label for="sop">Statement of Purpose</label><textarea id="sop" name="sop" rows="4"></textarea>
  <label for="pw">Portal Password (never touched by Scout)</label><input id="pw" type="password" name="password">
  <button type="button">Submit application</button>
</div>
<script>
// ── harness: emulate chrome.storage with the same data shape sync.js writes ──
window.__scoutHarness = true;
window.chrome = { storage: { local: {
  get(key, cb) {
    const grab = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
    cb({ scoutData: {
      master: grab('scout-master') || { firstName: 'Riya', lastName: 'Sharma', dob: '2009-03-14', phone: '9876543210', fatherName: 'Rakesh Sharma', board12: 'CBSE', pct12: '92', college: 'BITS Pilani', cgpa: '8.1', github: 'https://github.com/riyacodes', personalStatement: 'I build ML tools for Indian classrooms — gradeflow auto-grades handwritten sheets; vidyaqa runs offline for low-bandwidth schools.' },
      kit: grab('scout-kit') || { email: 'riya@bits-pilani.ac.in' },
      profile: grab('scout-profile') || {},
      user: { name: 'Riya Sharma', email: 'riya@bits-pilani.ac.in' },
    } });
  },
} } };
</script>
<script src="/extension/fill.js?v=2"></script>
</body>
</html>
